services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: maia-news-backend
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: maia-news-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
