<header class="top-row">
  {% if back %}
    <a class="icon-link" href="{{ back }}" aria-label="Volver">‹</a>
  {% else %}
    <span></span>
  {% endif %}
  <h1 class="page-title">{{ title }}</h1>
  {% if action %}
    <a class="icon-link" href="{{ action.href }}" aria-label="{{ action.label }}">{{ action.icon }}</a>
  {% else %}
    <span></span>
  {% endif %}
</header>
