{% extends "analyzer/base.html" %}
{% block content %}
<h1 class="plain-title">Explorar articulos</h1>
<p class="lead">Encuentra articulos por tema, fuente o perspectiva</p>
<div class="search-row">
  <input placeholder="Buscar articulos o temas..." aria-label="Buscar">
  <button aria-label="Filtros">filter</button>
</div>
<h3>Filtros</h3>
<form class="filter-form">
  <label>Tema<select><option>Inmigracion</option><option>Economia</option><option>Politica</option></select></label>
  <span>Perspectiva</span>
  <div class="choice-row"><button type="button">LEFT</button><button type="button">CENTER</button><button type="button">RIGHT</button></div>
  <label>Fuente<select><option>Todas las fuentes</option><option>CNN</option><option>Reuters</option></select></label>
  <label>Fecha<select><option>Ultimos 30 dias</option><option>Esta semana</option></select></label>
  <button class="primary-button" type="button">Aplicar filtros</button>
</form>
{% endblock %}
