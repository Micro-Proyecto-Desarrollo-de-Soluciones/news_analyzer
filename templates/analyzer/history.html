{% extends "analyzer/base.html" %}
{% block content %}
<h1 class="plain-title">Historial de analisis</h1>
<div class="article-list">
  {% for logo, title, side, score, date in history_items %}
    <article class="panel history-card">
      <span class="logo small">{{ logo }}</span>
      <div>
        <h2>{{ title }}</h2>
        <p><b class="{{ side|lower }}">{{ side }}</b> · {{ score }}</p>
        <small>{{ date }}</small>
      </div>
      <button class="bookmark" aria-label="Guardar"></button>
    </article>
  {% endfor %}
</div>
{% endblock %}
