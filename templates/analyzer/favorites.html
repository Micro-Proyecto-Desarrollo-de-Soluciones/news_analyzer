{% extends "analyzer/base.html" %}
{% block content %}
<h1 class="plain-title">Favoritos</h1>
<div class="article-list">
  {% for logo, source, title, side, date in favorites %}
    <article class="panel favorite-card">
      <span class="logo small">{{ logo }}</span>
      <div>
        <p class="source">{{ source }} <em>{{ side }}</em></p>
        <h2>{{ title }}</h2>
        <small>{{ date }}</small>
      </div>
      <button class="bookmark saved" aria-label="Favorito"></button>
    </article>
  {% endfor %}
</div>
{% endblock %}
