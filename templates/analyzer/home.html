{% extends "analyzer/base.html" %}
{% block content %}
<div class="home-hero">
  <div>
    <h1>News<br><span>Perspective</span><br>Analyzer</h1>
    <p>Entiende la perspectiva detras de las noticias que lees.</p>
  </div>
  <div class="app-mark">
    <span></span><span></span><span></span>
  </div>
</div>

<section class="panel input-panel">
  <div class="segmented">
    <button class="selected">Pegar URL</button>
    <button>Pegar Texto</button>
  </div>
  <label class="url-field">
    <span>link</span>
    <input value="https://ejemplo.com/noticia" aria-label="URL de noticia">
  </label>
  <a class="primary-button" href="{% url 'analyzer:analyzing' %}">Analizar noticia</a>
</section>

<p class="muted centered">o prueba con un ejemplo</p>
<div class="category-grid">
  <a class="category" href="{% url 'analyzer:perspectives' %}"><span>capitol</span><b>Politica</b></a>
  <a class="category" href="{% url 'analyzer:explore' %}"><span>chart</span><b>Economia</b></a>
  <a class="category" href="{% url 'analyzer:explore' %}"><span>group</span><b>Inmigracion</b></a>
</div>
{% endblock %}
